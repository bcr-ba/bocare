# Maps French and English symptom phrases to English MedlinePlus search terms.
# MedlinePlus only matches short English keywords, so full sentences or French return nothing.
# Order matters: emergencies first, because only the first `max_terms` matches are searched.
# Phrases match on word boundaries with an optional plural "s" ("burn" won't match "heartburn").

max_terms: 3
terms:
