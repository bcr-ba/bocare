# Runs on every push and pull request. Tests needing the models (live answers, retrieval
# evaluation) run locally: GitHub's runners have no GPU and no Ollama.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen   # desktop UI tests run without a screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: pip install -r requirements.txt
      - run: ruff check backend desktop scripts evaluation
      - run: pytest -v

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bocare-backend:ci .
      - name: Smoke test (the API must answer /health without models or index)
        run: |
          docker run -d --name bocare -p 8000:8000 -e STATE_BACKEND=memory bocare-backend:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs bocare
          exit 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
